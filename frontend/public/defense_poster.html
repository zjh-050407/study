<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高校教务管理系统 - 答辩封面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .poster {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 30%, #bfdbfe 70%, #e0e7ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景装饰圆 */
    .poster::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.35) 0%, transparent 70%);
      top: -200px;
      left: -200px;
    }
    .poster::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 243, 252, 0.3) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: rgba(59, 130, 246, 0.2);
      top: 100px; right: 200px;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: rgba(14, 165, 233, 0.18);
      bottom: 150px; left: 150px;
    }

    /* 主卡片 */
    .main-card {
      position: relative;
      z-index: 10;
      width: 1200px;
      padding: 80px 100px;
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.65) 0%,
        rgba(224, 242, 254, 0.55) 50%,
        rgba(191, 219, 254, 0.5) 100%
      );
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.9),
        0 32px 64px rgba(31, 110, 200, 0.15),
        0 12px 24px rgba(31, 110, 200, 0.1);
      text-align: center;
      transform: rotateX(2deg);
    }

    .main-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      background: linear-gradient(125deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.05) 45%, transparent 100%);
      pointer-events: none;
      z-index: -1;
    }

    /* 顶部标签 */
    .badge {
      display: inline-block;
      padding: 10px 32px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(14, 165, 233, 0.15));
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 50px;
      color: #1d4ed8;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 4px;
      margin-bottom: 36px;
      backdrop-filter: blur(10px);
    }

    /* 主标题 */
    .title {
      font-size: 72px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 8px;
      margin-bottom: 16px;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(31, 110, 200, 0.12);
    }

    .subtitle {
      font-size: 32px;
      font-weight: 500;
      color: #3b82f6;
      letter-spacing: 2px;
      margin-bottom: 48px;
    }

    .divider {
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      margin: 0 auto 48px;
      border-radius: 2px;
    }

    /* 功能亮点 */
    .features {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(147, 197, 253, 0.4);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 12px rgba(31, 110, 200, 0.06);
    }
    .feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .feature-text {
      font-size: 20px;
      color: #1e3a5f;
      font-weight: 500;
    }

    /* 技术栈 */
    .tech-stack {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 40px;
    }
    .tech-tag {
      padding: 10px 24px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(14, 165, 233, 0.12));
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      color: #1d4ed8;
      font-size: 18px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    /* 团队成员 */
    .team-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .team-title {
      font-size: 18px;
      font-weight: 600;
      color: #3b82f6;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .team-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .team-leader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(14, 165, 233, 0.18));
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(31, 110, 200, 0.08);
    }
    .team-leader-label {
      font-size: 16px;
      font-weight: 700;
      color: #1d4ed8;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .team-leader-name {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }
    .team-member {
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(147, 197, 253, 0.4);
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      color: #1e3a5f;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(31, 110, 200, 0.05);
    }

    /* 底部装饰线 */
    .bottom-line {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: #5a7a9c;
      font-size: 18px;
      letter-spacing: 6px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="main-card">
      <div class="badge">PROJECT SHOWCASE</div>
      <div class="title">高校教务管理系统</div>
      <div class="subtitle">Academic Management System</div>
      <div class="divider"></div>

      <div class="features">
        <div class="feature-item">
          <div class="feature-icon">1</div>
          <div class="feature-text">智能排课冲突检测</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">2</div>
          <div class="feature-text">成绩加权与绩点计算</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">3</div>
          <div class="feature-text">操作日志审计</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">4</div>
          <div class="feature-text">角色分级权限控制</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">5</div>
          <div class="feature-text">注册审批管理</div>
        </div>
      </div>

      <div class="tech-stack">
        <div class="tech-tag">Spring Boot</div>
        <div class="tech-tag">Vue.js</div>
        <div class="tech-tag">Element Plus</div>
        <div class="tech-tag">MySQL</div>
      </div>

      <div class="team-section">
        <div class="team-title">团队成员</div>
        <div class="team-row">
          <div class="team-leader">
            <span class="team-leader-label">组长</span>
            <span class="team-leader-name">张佳豪</span>
          </div>
          <div class="team-member">林鑫珏</div>
          <div class="team-member">郑昊</div>
          <div class="team-member">许仕家</div>
          <div class="team-member">戴铭威</div>
        </div>
      </div>
    </div>

    <div class="bottom-line">全栈教务信息化解决方案</div>
  </div>
</body>
</html>
