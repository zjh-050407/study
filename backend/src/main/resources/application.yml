spring:
  datasource:
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_manager
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      static-locations: file:${app.upload-path}

server:
  port: 8082

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

app:
  upload-path: ./uploads/
  base-url: http://localhost:8082/
  jwt:
    secret: ${JWT_SECRET:Vx8#pQ2@zL7!mR4%tN6&kY9(wC3^fH5)dB1*sJ0%eG8}
    expire: ${JWT_EXPIRE:86400000}