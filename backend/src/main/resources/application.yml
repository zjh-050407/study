spring:
  datasource:
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_manager
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      static-locations: file:${app.upload-path}

server:
  port: 8082

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

app:
  upload-path: ./uploads/
  base-url: http://localhost:8082/
  selection:
    redis-enabled: ${SELECTION_REDIS_ENABLED:true}
  jwt:
    # 安全加固：无默认密钥，必须通过环境变量注入（≥32字节），否则拒绝启动
    secret: ${JWT_SECRET}
    expire: ${JWT_EXPIRE:86400000}
  cors:
    # CORS 白名单（逗号分隔），生产按实际域名收紧
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}